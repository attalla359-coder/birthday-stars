<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>حاجة صغيرة ليكي ✨</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif
}

body{
  background:
    radial-gradient(circle at 50% 35%,#172654 0%,#090f25 42%,#030611 100%);
  color:#fff;
}

body:before,
body:after{
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(173,211,255,.7) 0 1px,transparent 1.4px);
  background-size:97px 97px,157px 157px;
  animation:drift 45s linear infinite;
  opacity:.55;
}

body:after{
  background-size:211px 211px,131px 131px;
  animation-duration:70s;
  opacity:.28;
  animation-direction:reverse
}

@keyframes drift{
  to{transform:translate3d(80px,55px,0)}
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  opacity:0;
  pointer-events:none;
  transition:opacity .8s ease;
}

.screen.active{
  opacity:1;
  pointer-events:auto
}

.card{
  width:min(92vw,570px);
  padding:34px 26px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:30px;
  background:rgba(9,15,38,.62);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  text-align:center;
}

h1{
  font-size:clamp(28px,7vw,45px);
  margin:0 0 14px
}

h2{
  font-size:clamp(24px,6vw,34px);
  margin:0 0 15px
}

p{
  font-size:18px;
  line-height:1.95;
  color:#e9efff;
  margin:10px 0
}

.small{
  font-size:14px;
  color:#aebbe0
}

button{
  border:0;
  border-radius:999px;
  padding:14px 28px;
  margin-top:20px;
  font-size:17px;
  font-weight:700;
  color:#071020;
  background:#dce9ff;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(150,190,255,.2);
  transition:.25s
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 35px rgba(150,190,255,.35)
}

input{
  width:100%;
  padding:15px 18px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:white;
  text-align:center;
  font-size:18px;
  outline:none
}

input::placeholder{
  color:#9ca9c8
}

.error{
  color:#ffb8c4;
  min-height:25px;
  margin-top:10px
}

#sky{
  position:absolute;
  inset:0;
  display:none
}

#sky.active{
  display:block
}

.title{
  position:absolute;
  top:7vh;
  left:0;
  right:0;
  text-align:center;
  padding:0 20px;
  z-index:5
}

.title h1{
  font-size:clamp(27px,7vw,43px);
  margin-bottom:5px
}

.title p{
  font-size:15px;
  color:#b9c6e7;
  margin:0
}

.progress{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  height:5px;
  background:rgba(255,255,255,.12);
  border-radius:99px;
  overflow:hidden;
  z-index:10
}

.progress span{
  display:block;
  height:100%;
  width:0;
  background:#dbe9ff;
  transition:width .5s ease
}

.star{
  position:absolute;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  z-index:4;
  padding:0;
  transform:translate(-50%,-50%);
  display:none
}

.star .core{
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #b9dcff,
    0 0 36px rgba(150,200,255,.75);
  animation:pulse 1.7s ease-in-out infinite
}

.star:before,
.star:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:rgba(225,240,255,.8);
  transform:translate(-50%,-50%);
  border-radius:99px
}

.star:before{
  width:2px;
  height:54px
}

.star:after{
  width:54px;
  height:2px
}

.star .num{
  position:absolute;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  color:#cddcff;
  font-size:12px;
  white-space:nowrap;
  opacity:.85
}

.star.locked{
  filter:grayscale(1);
  opacity:.18;
  cursor:default
}

.star.done .core{
  background:#d8f3ff;
  box-shadow:
    0 0 8px #fff,
    0 0 22px #8dd7ff,
    0 0 42px #8dd7ff
}

@keyframes pulse{
  50%{
    transform:scale(1.3);
    opacity:.7
  }
}

.message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  z-index:20;
  background:rgba(2,7,20,.38);
  backdrop-filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:.45s
}

.message.show{
  opacity:1;
  pointer-events:auto
}

.message .card{
  max-height:82vh;
  overflow:auto
}

.label{
  color:#9fc7ff;
  font-size:13px;
  letter-spacing:.5px;
  margin-bottom:8px
}

.message p{
  font-size:18px
}

.next{
  min-width:190px
}

.finalText{
  font-size:19px;
  line-height:2.05!important;
  white-space:pre-line
}

.cursor{
  display:inline-block;
  width:2px;
  height:1.1em;
  background:#dce9ff;
  vertical-align:-.15em;
  animation:blink .8s infinite
}

@keyframes blink{
  50%{opacity:0}
}

.heart{
  position:fixed;
  pointer-events:none;
  font-size:20px;
  animation:floatUp 3.5s ease-out forwards;
  z-index:50
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(.6);
    opacity:0
  }

  15%{
    opacity:1
  }

  100%{
    transform:
      translateY(-260px)
      translateX(var(--x))
      scale(1.15);
    opacity:0
  }
}

#mute{
  position:absolute;
  right:18px;
  bottom:18px;
  z-index:30;
  width:46px;
  height:46px;
  padding:0;
  margin:0;
  background:rgba(255,255,255,.1);
  color:white;
  border:1px solid rgba(255,255,255,.15);
  font-size:19px
}

.shake{
  animation:shake .35s
}

@keyframes shake{
  25%{transform:translateX(7px)}
  50%{transform:translateX(-7px)}
  75%{transform:translateX(5px)}
}
</style>
</head>

<body>

<!-- شاشة كلمة السر -->
<section id="login" class="screen active">

  <div class="card">

    <div style="font-size:54px;margin-bottom:8px">
      🌙
    </div>

    <h1>حاجة صغيرة ليكي</h1>

    <p>
      في مفاجأة بسيطة مستنياكي...<br>
      بس الأول محتاجة كلمة السر 🤍
    </p>

    <input
      id="password"
      type="password"
      placeholder="اكتبي كلمة السر"
    >

    <div id="error" class="error"></div>

    <button onclick="unlock()">
      افتحي المفاجأة ✨
    </button>

    <p class="small">
      خدي وقتك... اللي جاي معمول مخصوص عشانك.
    </p>

  </div>

</section>


<!-- السماء والنجوم -->
<section id="sky">

  <div class="progress">
    <span id="bar"></span>
  </div>

  <div class="title">

    <h1>
      رسالة من النجوم ✨
    </h1>

    <p id="hint">
      ابدئي بالنجمة الأولى... وكل نجمة هتوصلك للي بعدها.
    </p>

  </div>


  <button id="mute" onclick="toggleSound()">
    🔊
  </button>


  <!-- النجمة 1 -->
  <button
    class="star"
    style="left:20%;top:30%"
    onclick="openStar(0)"
  >
    <span class="core"></span>
    <span class="num">1</span>
  </button>


  <!-- النجمة 2 -->
  <button
    class="star locked"
    style="left:71%;top:28%"
    onclick="openStar(1)"
  >
    <span class="core"></span>
    <span class="num">2</span>
  </button>


  <!-- النجمة 3 -->
  <button
    class="star locked"
    style="left:48%;top:39%"
    onclick="openStar(2)"
  >
    <span class="core"></span>
    <span class="num">3</span>
  </button>


  <!-- النجمة 4 -->
  <button
    class="star locked"
    style="left:82%;top:48%"
    onclick="openStar(3)"
  >
    <span class="core"></span>
    <span class="num">4</span>
  </button>


  <!-- النجمة 5 -->
  <button
    class="star locked"
    style="left:25%;top:55%"
    onclick="openStar(4)"
  >
    <span class="core"></span>
    <span class="num">5</span>
  </button>


  <!-- النجمة 6 -->
  <button
    class="star locked"
    style="left:57%;top:59%"
    onclick="openStar(5)"
  >
    <span class="core"></span>
    <span class="num">6</span>
  </button>


  <!-- النجمة 7 -->
  <button
    class="star locked"
    style="left:14%;top:73%"
    onclick="openStar(6)"
  >
    <span class="core"></span>
    <span class="num">7</span>
  </button>


  <!-- النجمة 8 -->
  <button
    class="star locked"
    style="left:79%;top:70%"
    onclick="openStar(7)"
  >
    <span class="core"></span>
    <span class="num">8</span>
  </button>


  <!-- النجمة 9 -->
  <button
    class="star locked"
    style="left:40%;top:76%"
    onclick="openStar(8)"
  >
    <span class="core"></span>
    <span class="num">9</span>
  </button>


  <!-- النجمة 10 -->
  <button
    class="star locked"
    style="left:64%;top:82%"
    onclick="openStar(9)"
  >
    <span class="core"></span>
    <span class="num">10</span>
  </button>


  <!-- النجمة 11 -->
  <button
    class="star locked"
    style="left:31%;top:18%"
    onclick="openStar(10)"
  >
    <span class="core"></span>
    <span class="num">11</span>
  </button>


  <!-- النجمة 12 -->
  <button
    class="star locked"
    style="left:88%;top:20%"
    onclick="openStar(11)"
  >
    <span class="core"></span>
    <span class="num">12</span>
  </button>


  <!-- الرسالة -->
  <div id="message" class="message">

    <div class="card">

      <div id="label" class="label"></div>

      <h2 id="messageTitle"></h2>

      <p id="messageBody"></p>

      <button
        class="next"
        onclick="nextStar()"
      >
        النجمة اللي بعدها ✨
      </button>

    </div>

  </div>

</section>


<!-- النهاية -->
<section id="final" class="screen">

  <div class="card">

    <div style="font-size:52px">
      ✨🤍✨
    </div>

    <h1>
      وآخر نجمة...
    </h1>

    <p
      id="typed"
      class="finalText"
    ></p>

    <span
      id="cursor"
      class="cursor"
    ></span>

    <button onclick="celebrate()">
      عيد ميلاد سعيد 🤍
    </button>

  </div>

</section>


<script>

/* =========================================
   كلمة السر
   ========================================= */

const CORRECT_PASSWORD = "رفيق الروح";


/* =========================================
   الرسائل - بالترتيب
   ========================================= */

const messages = [

  [
    "أول نجمة",
    "البداية",
    "طاب عمرك، وطاب قلبك، وطابت روحك... وأتمنى السنة الجديدة من عمرك تكون أهدى وأجمل من كل اللي فات."
  ],

  [
    "النجمة التانية",
    "وجودك",
    "في ناس وجودها عادي، وناس وجودها بيفرق... وإنتِ من الناس اللي وجودهم له معنى، وبيخلّي الأيام ألطف."
  ],

  [
    "النجمة التالتة",
    "حاجة بحبها فيكي",
    "بحب فيكي إنك على طبيعتك، وإن ليكي طريقتك الخاصة اللي بتخلي وجودك مميز من غير ما تحاولي."
  ],

  [
    "النجمة الرابعة",
    "قربك",
    "وجودك قريب من القلب من الحاجات اللي الواحد بيقدّرها، وبيفضل شاكر إنها موجودة في حياته."
  ],

  [
    "النجمة الخامسة",
    "دعوة من قلبي",
    "يا رب كل خطوة جاية في حياتك تقربك من حاجة نفسك فيها، وكل باب خير يخبط على بابك في وقته الصح."
  ],

  [
    "النجمة السادسة",
    "وقت الفرح",
    "أتمنى تضحكي أكتر، وتفرحي أكتر، وتعيشي لحظات تخليكي تبصي ورا بعدين وتبتسمي من غير ما تحسي."
  ],

  [
    "النجمة السابعة",
    "وقت التعب",
    "ولو الأيام في وقت ما كانتش سهلة، أتمنى تفضلي فاكرة إنك تستحقي دايمًا الطمأنينة، والونس، والناس اللي تفرح بوجودك."
  ],

  [
    "النجمة التامنة",
    "كلمة بسيطة",
    "يمكن الكلام مش دايمًا بيعرف يوصف اللي جوا القلب، بس يكفيني أقولك إن مكانتك عندي غالية، وإن وجودك مش حاجة عابرة."
  ],

  [
    "النجمة التاسعة",
    "أمنية ليكي",
    "أتمنى تفضلي ماشية في طريقك من غير ما تفقدي الحاجات الحلوة اللي فيكي، وتوصلي لكل حاجة نفسك فيها بطريقتك."
  ],

  [
    "النجمة العاشرة",
    "سنة جديدة",
    "كل سنة جديدة بتبدأ بصفحة فاضية... ويا رب صفحتك الجاية تتكتب فيها أيام حلوة، نجاح، راحة بال، وضحك كتير."
  ],

  [
    "النجمة الحادية عشرة",
    "من قلبي",
    "أنا ممتن لكل لحظة حلوة كان ليكي فيها أثر، ولكل مرة وجودك خلّى حاجة بسيطة تبقى أجمل."
  ],

  [
    "النجمة الأخيرة",
    "قبل النهاية",
    "وفي آخر نجمة، أحب أقولك حاجة واحدة: كل سنة وإنتِ بخير، ومبسوطة، ومطمنة... وربنا يفضل كاتبلك الخير في كل خطوة جاية."
  ]

];


let current = 0;

let audioCtx = null;
let master = null;
let muted = false;


/* =========================================
   فتح المفاجأة
   ========================================= */

function unlock(){

  const input =
    document.getElementById("password");

  const error =
    document.getElementById("error");


  if(input.value === CORRECT_PASSWORD){

    document
      .getElementById("login")
      .classList
      .remove("active");


    document
      .getElementById("sky")
      .classList
      .add("active");


    document
      .querySelectorAll(".star")[0]
      .style
      .display = "block";


    startMusic();

  }else{

    error.textContent =
      "الكلمة مش هي دي... جربي تاني 🤍";

    input.classList.remove("shake");

    void input.offsetWidth;

    input.classList.add("shake");

    input.value = "";

  }

}


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter"){
        unlock();
      }

    }
  );


/* =========================================
   فتح النجمة
   ========================================= */

function openStar(i){

  if(i !== current){
    return;
  }


  const [
    name,
    title,
    body
  ] = messages[i];


  document
    .getElementById("label")
    .textContent = name;


  document
    .getElementById("messageTitle")
    .textContent = title;


  document
    .getElementById("messageBody")
    .textContent = body;


  document
    .getElementById("message")
    .classList
    .add("show");

}


/* =========================================
   النجمة التالية
   ========================================= */

function nextStar(){

  document
    .getElementById("message")
    .classList
    .remove("show");


  document
    .querySelectorAll(".star")[current]
    .classList
    .add("done");


  current++;


  if(current < messages.length){

    document
      .querySelectorAll(".star")[current]
      .classList
      .remove("locked");


    document
      .querySelectorAll(".star")[current]
      .style
      .display = "block";


    document
      .getElementById("bar")
      .style
      .width =
      ((current) / messages.length * 100) + "%";


    document
      .getElementById("hint")
      .textContent =
      `دلوقتي النجمة رقم ${current + 1} مستنياكي ✨`;

  }else{

    document
      .getElementById("bar")
      .style
      .width = "100%";


    setTimeout(
      showFinal,
      500
    );

  }

}


/* =========================================
   الشاشة النهائية
   ========================================= */

function showFinal(){

  document
    .getElementById("sky")
    .classList
    .remove("active");


  document
    .getElementById("final")
    .classList
    .add("active");


  const text = `كل سنة وإنتِ طيبة يا جميلة 🤍

يمكن الرسالة دي مجرد شاشة فيها نجوم وكلام،
لكن كل كلمة فيها اتعملت مخصوص عشان أقولك حاجة بسيطة من قلبي.

وجودك في حياتي حاجة بقدّرها،
وقربك من الحاجات اللي بتخلّي الأيام أحلى.

أتمنى السنة الجديدة تكون شبه قلبك:
هادية، جميلة، ومليانة حاجات تفرّحك.

وربنا يحققلك اللي نفسك فيه،
ويبعد عنك أي حاجة تقلقك،
ويفضل قلبك مرتاح ومبسوط.

كل سنة وإنتِ بخير،
وكل سنة وإنتِ أقرب للفرحة اللي تستحقيها.

عيد ميلاد سعيد يا كل الخير 🤍✨`;


  typeText(
    text,
    0
  );


  celebrate();

}


/* =========================================
   الكتابة حرف حرف
   ========================================= */

function typeText(text,i){

  if(i <= text.length){

    document
      .getElementById("typed")
      .textContent =
      text.slice(0,i);


    setTimeout(
      () => typeText(text,i + 1),
      22
    );

  }

}


/* =========================================
   تأثير الاحتفال
   ========================================= */

function celebrate(){

  for(let i = 0; i < 28; i++){

    setTimeout(() => {

      const h =
        document.createElement("div");


      h.className = "heart";


      h.textContent =
        ["🤍","✨","♡","🌟"]
        [Math.floor(Math.random() * 4)];


      h.style.left =
        (10 + Math.random() * 80) + "vw";


      h.style.bottom =
        (5 + Math.random() * 20) + "vh";


      h.style.setProperty(
        "--x",
        (Math.random() * 160 - 80) + "px"
      );


      document
        .body
        .appendChild(h);


      setTimeout(
        () => h.remove(),
        3600
      );

    }, i * 90);

  }

}


/* =========================================
   الموسيقى الهادئة
   ========================================= */

function startMusic(){

  try{

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    master =
      audioCtx.createGain();


    master.gain.value = .045;


    master.connect(
      audioCtx.destination
    );


    const notes = [
      261.63,
      329.63,
      392,
      523.25,
      392,
      329.63,
      293.66,
      349.23
    ];


    let step = 0;


    function tick(){

      if(!audioCtx || muted){
        return;
      }


      const o =
        audioCtx.createOscillator();


      const g =
        audioCtx.createGain();


      o.type = "sine";


      o.frequency.value =
        notes[step % notes.length];


      g.gain.setValueAtTime(
        0,
        audioCtx.currentTime
      );


      g.gain.linearRampToValueAtTime(
        .45,
        audioCtx.currentTime + .08
      );


      g.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + 1.5
      );


      o.connect(g);

      g.connect(master);


      o.start();


      o.stop(
        audioCtx.currentTime + 1.6
      );


      step++;


      setTimeout(
        tick,
        900
      );

    }


    tick();

  }catch(e){}

}


/* =========================================
   كتم / تشغيل الموسيقى
   ========================================= */

function toggleSound(){

  muted = !muted;


  document
    .getElementById("mute")
    .textContent =
    muted ? "🔇" : "🔊";


  if(audioCtx){

    if(muted){

      audioCtx.suspend();

    }else{

      audioCtx.resume();

    }

  }

}

</script>
